<title>Edge Season</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/*FONTS*/
/* Layout: one-screen arcade. HUD and scoreboard on top, the rink fills the middle, one big RESET button at the bottom. */
:root {
  color-scheme: dark;
  --ink: #181425; --navy: #262b44; --slate: #3a4466; --steel: #5a6988; --mist: #c0cbdc; --white: #ffffff;
  --red: #e43b44; --red-dark: #9e2835; --gold: #feae34; --yellow: #fee761; --green: #63c74d; --cyan: #2ce8f5;
  --head: "Press Start 2P", "Courier New", monospace;
  --body: "Handjet", "Arial Narrow", "Segoe UI", sans-serif;
  --px: 4px;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--ink); color: var(--mist); font-family: var(--body); font-size: 22px; line-height: 1.15; overflow: hidden; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
button, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--cyan); outline-offset: 2px; }
canvas { image-rendering: pixelated; }
p { margin: 0; }
.app { height: 100%; max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; }
.gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

.hud { display: flex; align-items: center; gap: 10px; padding-block: 6px; border-bottom: var(--px) solid var(--slate); }
.hud__ce { font-family: var(--head); font-size: 11px; background: var(--red); color: var(--ink); padding: 8px 7px; border: 3px solid var(--white); }
.hud__t { font-family: var(--head); font-size: 9px; color: var(--yellow); flex: 1 1 0; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip { font-family: var(--head); font-size: 9px; background: var(--ink); color: var(--green); border: 3px solid var(--green); padding: 7px 8px; min-height: 44px; min-width: 44px; }
.chip--x { color: var(--white); border-color: var(--white); font-size: 12px; }
.chip[aria-pressed="false"] { color: var(--steel); border-color: var(--steel); }
.chip--lang { background: var(--cyan); color: var(--ink); border-color: var(--cyan); }

/* text screens */
.stage { flex: 1 1 0; min-height: 0; overflow-y: auto; padding-block: 18px 24px; display: flex; flex-direction: column; gap: 14px; }
.h1 { font-family: var(--head); font-size: 15px; line-height: 1.5; color: var(--yellow); margin: 0; text-wrap: balance; }
.h2 { font-family: var(--head); font-size: 10px; line-height: 1.6; color: var(--cyan); margin: 0; letter-spacing: .04em; }
.tag { font-family: var(--head); font-size: 9px; letter-spacing: .06em; color: var(--ink); background: var(--yellow); padding: 5px 6px; display: inline-block; align-self: flex-start; }
.tag--red { background: var(--red); color: var(--white); }
.lead { color: var(--white); font-size: 24px; }
.note { font-size: 20px; color: #8b9bb4; }
.panel { background: var(--navy); border: var(--px) solid var(--slate); padding: 14px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 var(--px) 0 #0e0c18; }
.panel--hot { border-color: var(--yellow); }
.btn { font-family: var(--head); font-size: 11px; line-height: 1.4; background: var(--gold); color: var(--ink); border: 0; padding: 14px 12px; min-height: 52px; width: 100%; box-shadow: inset 0 4px 0 var(--yellow), inset 0 -4px 0 #b86f50, 0 4px 0 #0e0c18; }
.btn:active { transform: translateY(2px); }
.btn:disabled { background: var(--slate); color: var(--steel); box-shadow: none; cursor: default; }
.btn--ghost { background: var(--ink); color: var(--white); box-shadow: inset 0 0 0 3px var(--white); }
.words { display: flex; flex-wrap: wrap; gap: 8px; }
.word { background: var(--ink); border: 3px solid var(--steel); color: var(--mist); padding: 6px 10px; font-size: 22px; text-align: left; }
.word[aria-pressed="true"] { background: var(--yellow); border-color: var(--yellow); color: var(--ink); }
.opt { background: var(--ink); border: 3px solid var(--steel); padding: 10px 12px; text-align: left; display: flex; flex-direction: column; gap: 4px; color: var(--mist); width: 100%; }
.opt b { font-family: var(--head); font-size: 10px; font-weight: 400; color: var(--white); line-height: 1.5; }
.opt[aria-pressed="true"] { border-color: var(--yellow); background: #2f3554; }
.opt[aria-pressed="true"] b { color: var(--yellow); }
.quote { border-left: var(--px) solid var(--yellow); padding-left: 12px; color: var(--white); }
.stats { display: grid; grid-template-columns: 1fr auto auto; gap: 6px 14px; align-items: baseline; }
.stats span { font-size: 21px; }
.stats b { font-family: var(--head); font-size: 11px; font-weight: 400; color: var(--white); text-align: right; font-variant-numeric: tabular-nums; }
.stats b.was { color: var(--steel); }
.stats i { font-family: var(--head); font-size: 9px; font-style: normal; color: var(--cyan); text-align: right; }
.final { font-family: var(--head); font-size: 26px; color: var(--white); text-align: center; letter-spacing: .08em; }
.xprow { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.xpnum { font-family: var(--head); font-size: 14px; font-weight: 400; color: var(--green); }
.xpbar { height: 16px; background: #0e0c18; border: 3px solid var(--steel); }
.xpbar i { display: block; height: 100%; background: var(--green); transition: width 1.1s steps(22); }
.stats--xp i { color: var(--steel); }
.final small { display: block; font-size: 9px; color: var(--steel); margin-top: 8px; letter-spacing: .04em; }
.keys { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; align-items: baseline; }
.keys b { font-family: var(--head); font-size: 9px; font-weight: 400; color: var(--yellow); }

/* match */
.board { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; padding-block: 5px; }
.board__s { font-family: var(--head); font-size: 9px; color: var(--mist); }
.board__s b { font-size: 18px; font-weight: 400; color: var(--white); margin-left: 6px; font-variant-numeric: tabular-nums; }
.board__s:last-child { text-align: right; }
.board__s:last-child b { margin: 0 6px 0 0; }
.board__t { font-family: var(--head); font-size: 14px; color: var(--yellow); font-variant-numeric: tabular-nums; }
.head { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: center; padding-bottom: 5px; }
.head span { font-family: var(--head); font-size: 10px; color: var(--mist); letter-spacing: .06em; }
.head b { height: 24px; border: 3px solid var(--mist); display: block; background: linear-gradient(90deg, #1f4d2a 0 35%, #6b5a1e 35% 60%, #5c1f2a 60% 100%); }
.head b i { display: block; height: 100%; width: 0; background: var(--green); }
.rinkwrap { flex: 1 1 0; min-height: 0; display: flex; align-items: center; justify-content: center; }
#rink { display: block; border: var(--px) solid var(--slate); touch-action: none; user-select: none; -webkit-user-select: none; background: #dfe9f5; }
.pad { padding-block: 6px max(10px, env(safe-area-inset-bottom, 0px)); }
.foot { display: flex; flex-direction: column; gap: 8px; padding-block: 10px max(12px, env(safe-area-inset-bottom, 0px)); border-top: var(--px) solid var(--slate); background: var(--ink); }
.app:has(.tabs) .foot { padding-bottom: 10px; }
.reset.is-call { animation: call .7s steps(2) infinite; }
.reset.is-cool { background: var(--slate); color: var(--steel); box-shadow: none; }
@keyframes call { 50% { box-shadow: inset 0 0 0 4px var(--white), 0 4px 0 #0e0c18; } }
@media (prefers-reduced-motion: reduce) { .reset.is-call { animation: none; box-shadow: inset 0 0 0 4px var(--white); } }
.reset { position: relative; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; background: var(--red); color: var(--white); box-shadow: inset 0 4px 0 #f6757a, inset 0 -4px 0 var(--red-dark), 0 4px 0 #0e0c18; padding-block: 18px; min-height: 60px; }
.reset i { position: absolute; inset: 0 auto 0 0; width: 0; background: rgba(255, 255, 255, .45); pointer-events: none; }
.reset span { position: relative; }

.hero { display: flex; align-items: center; gap: 14px; }
.hero canvas { width: 68px; height: 72px; flex: none; }
.grow { flex: 1 1 0; min-width: 0; }
.row { display: flex; align-items: center; gap: 12px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.btn--red { background: var(--red); color: var(--white); box-shadow: inset 0 4px 0 #f6757a, inset 0 -4px 0 var(--red-dark), 0 4px 0 #0e0c18; }
.tag--mute { background: var(--slate); color: var(--mist); }
.num { font-family: var(--head); font-size: 10px; font-weight: 400; color: var(--white); white-space: nowrap; }
.dim { color: #8b9bb4; }
.tabs { display: grid; grid-template-columns: repeat(4, 1fr); border-top: var(--px) solid var(--slate); background: var(--navy); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tab { font-family: var(--head); font-size: 9px; background: none; border: 0; color: #8b9bb4; padding: 4px 2px; min-height: 54px; }
.tab[aria-current="page"] { color: var(--yellow); box-shadow: inset 0 4px 0 var(--yellow); }
.node { display: flex; gap: 12px; align-items: center; background: var(--navy); border: var(--px) solid var(--slate); padding: 10px; width: 100%; text-align: left; color: var(--mist); }
.node canvas { width: 40px; height: 40px; flex: none; }
.node b { font-family: var(--head); font-size: 9px; font-weight: 400; line-height: 1.5; color: var(--white); display: block; }
.node--hot { border-color: var(--yellow); }
.node--locked { opacity: .55; }
.node .xpbar { display: block; height: 12px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 0; }
.kv dt { font-family: var(--head); font-size: 9px; color: var(--cyan); padding-top: 6px; }
.kv dd { margin: 0; color: var(--white); }
.score { font-family: var(--head); font-size: 9px; line-height: 1.7; color: var(--yellow); text-align: center; margin: 0; }
.hit { font-family: var(--head); font-size: 12px; line-height: 1.6; color: var(--white); background: var(--red-dark); border: var(--px) solid var(--red); padding: 16px 12px; text-align: center; min-height: 76px; display: flex; align-items: center; justify-content: center; }
.hit.ok { background: #1f4d2a; border-color: var(--green); }
.timer { height: 18px; background: var(--navy); border: 3px solid var(--steel); }
.timer i { display: block; height: 100%; background: var(--cyan); }
.timer.low i { background: var(--red); }
label.f { display: flex; flex-direction: column; gap: 6px; }
label.f span { font-family: var(--head); font-size: 9px; line-height: 1.6; color: var(--cyan); }
.in { background: #0e0c18; border: 3px solid var(--steel); color: var(--white); padding: 10px; width: 100%; font-size: 24px; border-radius: 0; resize: none; }
.in:focus { border-color: var(--yellow); outline: none; }

.dots3 { display: inline-flex; gap: 4px; margin-left: 8px; vertical-align: middle; }
.dots3 i { width: 10px; height: 10px; border: 2px solid var(--steel); background: var(--ink); display: block; }
.dots3 i.on { background: var(--yellow); border-color: var(--yellow); }
.dots3 i.fl { background: var(--cyan); border-color: var(--cyan); }
.stage__in { margin-block: auto; display: flex; flex-direction: column; gap: 14px; }
.ask { position: fixed; inset: 0; z-index: 40; background: rgba(14, 12, 24, .82); display: flex; align-items: center; justify-content: center; }
.ask .panel { width: 100%; max-width: 420px; }
.score--warn { color: var(--red); }
.fillc { background: var(--cyan) !important; opacity: .85; }
.btn.is-done, .btn.is-done:disabled { background: #1f4d2a; color: var(--green); box-shadow: inset 0 0 0 3px var(--green); }
.reset { -webkit-touch-callout: none; }

.chip--q { color: var(--yellow); border-color: var(--yellow); font-size: 12px; }
.rinkwrap { position: relative; }
.coach { position: absolute; left: 50%; bottom: 40%; transform: translateX(-50%); width: min(88%, 300px); background: rgba(24, 20, 37, .94); border: var(--px) solid var(--yellow); padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; pointer-events: none; z-index: 5; }
.coach--mid { pointer-events: auto; }
.coach__top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.coach b { font-family: var(--head); font-size: 10px; font-weight: 400; line-height: 1.5; color: var(--yellow); }
.coach p { color: var(--white); font-size: 21px; }
.coach__skip { font-family: var(--head); font-size: 8px; color: var(--mist); background: none; border: 0; padding: 12px 4px; pointer-events: auto; text-decoration: underline; }
.helpbox { max-height: 88%; overflow: hidden; }
.helpbox .keys { flex: 1 1 auto; min-height: 0; overflow-y: auto; }
.helpbox .btn { flex: none; }
@media (max-width: 360px) { body { font-size: 20px; } }
</style>

<div class="app" id="app"></div>

<script>
(function () {
  'use strict';
  var OUT = '#181425';
/*SPRITES*/

  /* ---------- state ---------- */
  var KEY = 'ce-season-proto-2';
  function blank() { return { lang: null, sound: true, n: 1, reset: null, upg: {}, hist: [], seen: null, xp: 0, best: {} }; }
  var S = blank();
  try { var raw = localStorage.getItem(KEY); if (raw) { var o = JSON.parse(raw); for (var k in o) S[k] = o[k]; } } catch (e) {}
  if (!S.lang) S.lang = /^(ru|uk|be|kk)\b/i.test(navigator.language || '') ? 'ru' : 'en';
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
  function t(ru, en) { return S.lang === 'en' ? en : ru; }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  var view = 'intro', pick = {}, askWipe = false, DUR = 60, paused = false;
  var app = document.getElementById('app');

  /* ---------- sound ---------- */
  var audio = null;
  function beep(notes, vol) {
    if (!S.sound) return;
    try {
      if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
      if (audio.state === 'suspended') audio.resume();
      var at = audio.currentTime + 0.01;
      notes.forEach(function (n) {
        var o = audio.createOscillator(), g = audio.createGain();
        o.type = n[2] || 'square'; o.frequency.setValueAtTime(n[0], at);
        if (n[3]) o.frequency.exponentialRampToValueAtTime(n[3], at + n[1]);
        g.gain.setValueAtTime((vol || 0.05) * 0.5, at); g.gain.exponentialRampToValueAtTime(0.0001, at + n[1]);
        o.connect(g); g.connect(audio.destination); o.start(at); o.stop(at + n[1] + 0.02); at += n[1] * 0.85;
      });
    } catch (e) {}
  }
  // рёв трибун: короткий шум через полосовой фильтр
  function roar(v) {
    if (!S.sound) return;
    try {
      if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
      var n = Math.floor(audio.sampleRate * 0.9), buf = audio.createBuffer(1, n, audio.sampleRate), d = buf.getChannelData(0);
      for (var i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
      var src = audio.createBufferSource(), f = audio.createBiquadFilter(), g = audio.createGain();
      src.buffer = buf; f.type = 'bandpass'; f.frequency.value = 900; f.Q.value = 0.6; g.gain.value = 0.09 * v;
      src.connect(f); f.connect(g); g.connect(audio.destination); src.start();
    } catch (e) {}
  }
  function buzz(ms) { try { if (S.sound && navigator.vibrate) navigator.vibrate(ms); } catch (e) {} }
  var SFX = {
    tap: function () { beep([[660, 0.05]]); },
    shot: function () { beep([[900, 0.09, 'square', 180]]); },
    goal: function (k) { var m = Math.pow(1.122, Math.min(6, (k || 1) - 1)); beep([[523 * m, 0.07], [659 * m, 0.07], [784 * m, 0.07], [1047 * m, 0.24]], 0.07); roar(0.5 + Math.min(0.5, (k || 1) * 0.12)); },
    post: function () { beep([[1568, 0.05, 'triangle'], [1319, 0.16, 'triangle']], 0.09); },
    xp: function () { beep([[784, 0.05], [988, 0.05], [1175, 0.05], [1568, 0.2]], 0.05); },
    bad: function () { beep([[200, 0.1, 'triangle', 90]], 0.08); },
    riv: function () { beep([[140, 0.14, 'sawtooth'], [110, 0.22, 'sawtooth']], 0.06); },
    reset: function () { beep([[262, 0.12, 'triangle'], [392, 0.12, 'triangle'], [523, 0.12, 'triangle'], [784, 0.12, 'triangle'], [1047, 0.4, 'triangle']], 0.1); },
    flow: function () { beep([[659, 0.07], [784, 0.07], [988, 0.07], [1319, 0.3]], 0.06); },
    end: function () { beep([[523, 0.12], [392, 0.12], [523, 0.3]], 0.06); }
  };

  /* ---------- shell ---------- */
  function hud(title) {
    var live = view === 'play' || view === 'drill' || view === 'rdrill' || view === 'bench' || view === 'between';
    if (live) return '<header class="hud gut"><span class="hud__ce">CE</span><span class="hud__t">' + title + '</span><button class="chip chip--q" data-act="help" type="button" aria-label="' + t('Подсказка', 'Help') + '">?</button><button class="chip chip--x" data-act="quit" type="button" aria-label="' + t('Выйти', 'Quit') + '">✕</button></header>';
    return '<header class="hud gut"><span class="hud__ce">CE</span><span class="hud__t">' + title + '</span>' +
      '<button class="chip chip--q" data-act="help" type="button" aria-label="' + t('Подсказка', 'Help') + '">?</button>' +
      '<button class="chip chip--lang" data-act="lang" type="button" aria-label="' + t('Switch to English', 'Переключить на русский') + '">' + (S.lang === 'en' ? 'RU' : 'EN') + '</button>' +
      '<button class="chip" data-act="sound" type="button" aria-pressed="' + !!S.sound + '">' + t('ЗВУК', 'SOUND') + '</button></header>';
  }
  // главные кнопки экрана всегда внизу, под большим пальцем, а не в конце прокрутки
  function dock() {
    var st = document.querySelector('#stage > .stage__in') || document.getElementById('stage'); if (!st) return; var run = [];
    while (st.lastElementChild && st.lastElementChild.classList.contains('btn')) { run.unshift(st.lastElementChild); st.removeChild(st.lastElementChild); }
    if (!run.length) return; var f = document.createElement('div'); f.className = 'foot gut'; run.forEach(function (b) { f.appendChild(b); });
    var host = document.getElementById('stage'); host.parentNode.insertBefore(f, host.nextSibling);
  }
  function screen(title, body) { app.innerHTML = hud(title) + '<main class="stage gut" id="stage"><div class="stage__in">' + body + '</div></main>'; dock(); }
  function last() { return S.hist[S.hist.length - 1]; }
  function GESTURES() { return [t('Стукнуть клюшкой по льду', 'Tap the stick on the ice'), t('Поправить шлем', 'Adjust the helmet'), t('Сжать и разжать кулак', 'Clench and open the fist'), t('Глоток воды', 'A sip of water')]; }
  function WORDS() { return [t('Следующая', 'Next'), t('Здесь', 'Here'), t('Моя', 'Mine'), t('Дальше', 'Onward'), t('Играю', 'Play')]; }
  function UPG() {
    return [
      ['fast', t('БЫСТРЫЙ СБРОС', 'FAST RESET'), t('Сброс срабатывает за секунду, а не за полторы.', 'The reset takes one second, not one and a half.')],
      ['steady', t('ТВЁРДАЯ РУКА', 'STEADY HAND'), t('Когда голова горячая, бросок уводит на треть меньше.', 'When your head is hot, the shot drifts a third less.')],
      ['flow', t('ДЛИННЫЙ ПОТОК', 'LONG FLOW'), t('Поток держится 8 секунд вместо 5.', 'Flow lasts 8 seconds instead of 5.')]
    ];
  }

  /* ---------- text screens ---------- */
  function render() {
    if (view === 'play') return;
    if (hubRender()) return;
    if (view === 'intro') return intro();
    if (view === 'result') return result();
    if (view === 'craft') return craft();
    if (view === 'reflect') return reflect();
  }
  function intro() {
    var n = S.n, h = '<span class="tag">' + t('ПРОТОТИП · ХОККЕЙ', 'PROTOTYPE · HOCKEY') + '</span><h1 class="h1">' + t('МАТЧ ', 'MATCH ') + n + '</h1>';
    if (n === 1) h += '<p class="lead">' + t('60 секунд. Забей больше соперника.', '60 seconds. Outscore the rival.') + '</p>' +
      '<section class="panel"><div class="keys">' +
      '<b>' + t('ВЕДИ', 'DRAG') + '</b><span>' + t('Палец по льду: игрок едет за ним.', 'Finger on the ice: the player follows it.') + '</span>' +
      '<b>' + t('ТАП', 'TAP') + '</b><span>' + t('Бросок. Короткий тап или смахни вверх. Лови открытый угол.', 'The shot. A quick tap or a flick up. Pick the open corner.') + '</span>' +
      '<b>' + t('ГОЛОВА', 'HEAD') + '</b><span>' + t('Шкала сверху. Промахи и голы соперника толкают её вверх.', 'The meter on top. Misses and rival goals push it up.') + '</span>' +
      '<b>' + t('СБРОС', 'RESET') + '</b><span>' + t('Шкала пожелтела: держи красную кнопку внизу.', 'The meter turns yellow: hold the red button below.') + '</span>' +
      '</div><p class="note">' + (S.tut ? t('С клавиатуры: стрелки, пробел, R.', 'Keyboard: arrows, space, R.') : t('Сначала короткая разминка: покажем всё по шагам.', 'First a short warm-up: we show everything step by step.')) + '</p></section>';
    else if (n === 2) h += '<p class="lead">' + t('Тот же соперник. Теперь сброс твой.', 'Same rival. Now the reset is yours.') + '</p>' +
      '<section class="panel panel--hot"><span class="tag tag--red">' + t('ТВОЙ СБРОС', 'YOUR RESET') + '</span><h2 class="h2">' + t('КНОПКА СБРОСА', 'RESET BUTTON') + '</h2>' +

  function startBench(n) { var all = SITS(), st = S.days % all.length, list = []; for (var i = 0; i < n; i++) list.push(all[(st + i) % all.length]); BN = { list: list, i: 0, you: 0, riv: 0, ch: null, xp: 0 }; view = 'bench'; benchDraw(); }
  function benchDraw() {
    var b = BN, s = b.list[b.i], many = b.list.length > 1, h = '';
    if (many) h += '<div class="board"><span class="board__s">' + t('ТЫ', 'YOU') + '<b>' + b.you + '</b></span><span class="board__t">' + (b.i + 1) + ' / ' + b.list.length + '</span><span class="board__s"><b>' + b.riv + '</b>' + t('СОПЕРНИК', 'RIVAL') + '</span></div>';
    h += '<div class="hero"><canvas width="34" height="36" data-me></canvas><p class="lead grow">' + s.q + '</p></div>';
    if (b.ch == null) h += '<h2 class="h2">' + t('ЧТО ДЕЛАЕШЬ?', 'WHAT DO YOU DO?') + '</h2>' + s.o.map(function (o, k) { return '<button class="opt" type="button" data-act="bpick" data-k="' + k + '"><b>' + o[0] + '</b><span>' + o[1] + '</span></button>'; }).join('');
    else { var o = s.o[b.ch];

  function hubRender() {
    if (view === 'home') return home(), true; if (view === 'modes') return modes(), true; if (view === 'team') return team(), true; if (view === 'me') return me(), true;
    if (view === 'pre') return pre(), true; if (view === 'post') return post(), true; if (view === 'bench') return benchDraw(), true; if (view === 'between') return between(), true;
    if (view === 'rdrill') return resetDraw(), true; if (view === 'drill' || view === 'tres') return true;
    return false;
  }
  function hubAct(a, el) {
    if (a === 'tab') { clearInterval(RD && RD.tick); RD = null; BN = null; T = null; frm = {}; askWipe = false; view = el.getAttribute('data-v'); SFX.tap(); render(); return true; }
    if (a === 'train') { SFX.tap(); startTrain(['focus', 'reset', 'bench'], true); return true; }
    if (a === 'tnext') { SFX.tap(); runStep(); return true; }
    if (a === 'mode') { var m = el.getAttribute('data-m'); SFX.tap(); if (m === 'match') { S.n = (last() ? last().n : 0) + 1; view = 'intro'; render(); } else startTrain([m], false); return true; }
    if (a === 'r1') { if (RD && RD.ph === 'a') { RD.ph = 'b'; SFX.tap(); resetDraw(); } return true; }
    if (a === 'r3') { if (RD && RD.ph === 'c') resetEnd(true); return true; }
    if (a === 'bpick') { var o = BN.list[BN.i].o[+el.getAttribute('data-k')]; BN.ch = +el.getAttribute('data-k'); if (o[2] === 'for') { BN.you++; BN.xp += 20; SFX.goal(1); } else if (o[2] === 'against') { BN.riv++; SFX.riv(); } else { BN.xp += 10; SFX.tap(); } benchDraw(); return true; }
    if (a === 'bnext') { BN.i++; BN.ch = null; if (BN.i >= BN.list.length) { var b = BN; BN = null; T.res.benchXp = b.xp; T.res.benchDiff = b.you - b.riv; stepDone('bench', b.list.length > 1 ? b.you + ':' + b.riv : (b.you ? t('гол', 'goal') : b.riv ? t('пропустили', 'conceded') : t('ровно', 'steady'))); } else benchDraw(); return true; }
    if (a === 'pre' || a === 'post') { frm = {}; view = a; SFX.tap(); render(); return true; }
    if (a === 'predone') { if ((frm.task || '').trim()) S.focus1 = frm.task.trim(); S.xp += 10; save(); SFX.xp(); view = 'home'; render(); return true; }
    if (a === 'postdone') { S.focus1 = frm.focus.trim(); S.reviews++; S.xp += 40; save(); SFX.xp(); frm = {}; view = 'home'; render(); return true; }
    if (a === 'hub') { S.hub = true; save(); view = 'home'; render(); return true; }
    if (a === 'help') { SFX.tap(); openHelp(view); return true; }
    if (a === 'helpok') { var hq = document.getElementById('ask'); if (hq) hq.parentNode.removeChild(hq); paused = false; prev = performance.now(); SFX.tap(); return true; }
    if (a === 'tutskip' || a === 'tutdone') { S.tut = true; save(); SFX.tap(); cancelAnimationFrame(raf); startMatch(); return true; }
    if (a === 'quit') { if (document.getElementById('ask')) return true; paused = true; SFX.tap(); var q = document.createElement('div'); q.id = 'ask'; q.className = 'ask gut';
      q.innerHTML = '<section class="panel panel--hot" role="alertdialog" aria-label="' + t('Точно выйти?', 'Quit for sure?') + '"><p class="lead">' + t('Точно выйти?', 'Quit for sure?') + '</p><p class="note">' + t('Эта попытка не сохранится.', 'This attempt will not be saved.') + '</p><div class="two"><button class="btn btn--red" type="button" data-act="quityes">' + t('ВЫЙТИ', 'QUIT') + '</button><button class="btn btn--ghost" type="button" data-act="quitno">' + t('ОСТАТЬСЯ', 'STAY') + '</button></div></section>';
      app.appendChild(q); return true; }
    if (a === 'quitno') { var qq = document.getElementById('ask'); if (qq) qq.parentNode.removeChild(qq); paused = false; prev = performance.now(); SFX.tap(); return true; }
    if (a === 'quityes') { paused = false; cancelAnimationFrame(raf); if (RD) clearInterval(RD.tick); if (G) G.over = true; G = null; F = null; RD = null; BN = null; T = null; view = S.hub ? 'home' : 'intro'; SFX.tap(); render(); return true; }
    return false;
  }

        [t('НАЧАТЬ ЗАНОВО', 'START OVER'), t('Стирает весь прогресс на этом телефоне.', 'Erases all progress on this phone.')]]],
      drill: [t('ФОКУС ПОД ПОМЕХАМИ', 'FOCUS UNDER NOISE'), [
        [t('ЧТО ДЕЛАТЬ', 'WHAT TO DO'), t('Поставь палец на шайбу и веди его за ней. Рамка голубая: ты на шайбе.', 'Put your finger on the puck and follow it. A cyan frame means you are on the puck.')],
        [t('ПОМЕХИ', 'NOISE'), t('Надписи и красные шайбы только отвлекают. Трогать их не надо.', 'The banners and red pucks only distract. Do not touch them.')],
        [t('ШКАЛА ФОКУСА', 'FOCUS METER'), t('Падает, когда палец не на шайбе. Упала до нуля: упражнение закончено.', 'It drops when your finger is off the puck. At zero the drill ends.')],
        [t('СЧЁТ', 'SCORE'), t('Сколько секунд продержался. Шайба постепенно ускоряется.', 'How many seconds you lasted. The puck speeds up gradually.')]]],
      rdrill: [t('СБРОС НА ВРЕМЯ', 'TIMED RESET'), [
        [t('ЧТО ДЕЛАТЬ', 'WHAT TO DO'), t('Три кнопки по порядку: нажми движение, держи выдох до конца полосы, нажми слово.', 'Three buttons in order: tap the movement, hold the exhale until the bar fills, tap the word.')],
        [t('ВРЕМЯ', 'TIME'), t('На каждый эпизод шесть секунд. Успел: засчитан.', 'Six seconds for each episode. Make it in time and it counts.')],
        [t('ЗАЧЕМ', 'WHY'), t('Чтобы сброс стал привычкой и получался быстро, когда на льду что-то пошло не так.', 'So the reset becomes a habit and comes fast when something goes wrong on the ice.')]]],
      bench: [t('СКАМЕЙКА', 'THE BENCH'), [
        [t('ЧТО ДЕЛАТЬ', 'WHAT TO DO'), t('Прочитай ситуацию и выбери, как поступишь. Сразу увидишь, чем закончилась следующая смена.', 'Read the situation and choose what you do. You see right away how the next shift ends.')],
        [t('ЛУЧШИЙ ОТВЕТ', 'THE BEST ANSWER'), t('Не всегда сброс. Иногда нужнее слово партнёру или простое задание на смену.', 'Not always the reset. Sometimes a word to a teammate or a simple task for the shift matters more.')],
        [t('СЧЁТ', 'SCORE'), t('Хороший выбор: твоя команда забивает. Плохой: вам забивают.', 'A good choice: your team scores. A bad one: they score.')]]],
      result: [t('ИТОГ МАТЧА', 'MATCH RESULT'), [
        [t('ОПЫТ', 'EXPERIENCE'), t('Гол 10, сброс 15, секунда в потоке 5, доигранный матч 30.', 'A goal is 10, a reset 15, a second in flow 5, a finished match 30.')],
        [t('С ГОРЯЧЕЙ ГОЛОВОЙ', 'WITH A HOT HEAD'), t('Сколько секунд шкала была в красной зоне. Чем меньше, тем лучше.', 'How many seconds the meter was in the red zone. The less, the better.')],
        [t('СБРОСОВ', 'RESETS'), t('Сколько раз ты остудил голову кнопкой.', 'How many times you cooled your head with the button.')],
        [t('В ПОТОКЕ', 'IN FLOW'), t('Сколько секунд длился поток после трёх голов подряд.', 'How many seconds flow lasted after three goals in a row.')]]]
    };
    var any = [t('ПОДСКАЗКА', 'HELP'), [
      [t('ЧТО ЭТО', 'WHAT THIS IS'), t('Игра, которая тренирует голову. Навыки здесь работают как правила матча.', 'A game that trains your head. Skills work here as the rules of the match.')],
      [t('КНОПКА «?»', 'THE "?" BUTTON'), t('Есть на каждом экране и объясняет именно его.', 'It is on every screen and explains that screen.')]]];
    return H[v] || (v === 'tres' || v === 'between' ? H.modes : v === 'intro' ? H.play : any);
  }
  function openHelp(v) {
    if (document.getElementById('ask')) return; paused = true;
    var h = helpFor(v), q = document.createElement('div'); q.id = 'ask'; q.className = 'ask gut';
    q.innerHTML = '<section class="panel panel--hot helpbox" role="dialog" aria-label="' + h[0] + '"><h2 class="h2">' + h[0] + '</h2><div class="keys">' +
      h[1].map(function (r) { return '<b>' + r[0] + '</b><span>' + r[1] + '</span>'; }).join('') + '</div><button class="btn" type="button" data-act="helpok">' + t('ПОНЯТНО', 'GOT IT') + '</button></section>';
    app.appendChild(q);
  }

  // разминка: четыре шага перед первым матчем. Таймер и соперник стоят, шаг закрывается действием игрока
  function tutText() {
    var g = G, k = g.tut;
    if (k === 0) return [t('ВЕДИ ПАЛЬЦЕМ ПО ЛЬДУ', 'DRAG YOUR FINGER ON THE ICE'), t('Игрок едет за пальцем. Прокатись влево и вправо.', 'The player follows your finger. Skate left and right.')];
    if (k === 1) return [t('БРОСОК: КОРОТКИЙ ТАП', 'SHOT: A QUICK TAP'), g.tutMiss >= 2 ? t('Линия красная: на ней вратарь. Дождись зелёной и тапни.', 'The line is red: the goalie is in it. Wait for green and tap.') : t('Пунктир показывает бросок. Зелёный: открыто. Забей один гол.', 'The dashed line shows the shot. Green: it is open. Score one goal.')];
    if (k === 2) return [t('ГОЛОВА НАГРЕЛАСЬ', 'YOUR HEAD HEATED UP'), t('Шкала сверху пожелтела: бросок уводит. Держи красную кнопку внизу, пока кольцо не сомкнётся.', 'The meter on top turned yellow: the shot drifts. Hold the red button below until the ring closes.')];
    return [t('ГОЛОВА ХОЛОДНАЯ', 'YOUR HEAD IS COOL'), t('Шесть секунд бросок идёт точно. Три гола подряд включают поток: гол за два. Готов к матчу?', 'For six seconds the shot is true. Three goals in a row switch on flow: a goal counts double. Ready for the match?')];
  }
  function tutDraw() {
    var c = document.getElementById('coach'); if (!c || !G || G.tut == null) return; var x = tutText(), key = G.tut + '|' + (G.tutMiss >= 2) + '|' + S.lang;
    if (c.getAttribute('data-k') === key) return; c.setAttribute('data-k', key);
    c.innerHTML = '<div class="coach__top"><span class="tag">' + t('РАЗМИНКА ', 'WARM-UP ') + (G.tut + 1) + ' / 4</span><button class="coach__skip" type="button" data-act="tutskip">' + t('ПРОПУСТИТЬ', 'SKIP') + '</button></div><b>' + x[0] + '</b><p>' + x[1] + '</p>' +
      (G.tut === 3 ? '<button class="btn" type="button" data-act="tutdone">▶ ' + t('НАЧАТЬ МАТЧ', 'START THE MATCH') + '</button>' : '');
    c.className = 'coach' + (G.tut === 3 ? ' coach--mid' : '');
  }
  function tutStep(dt) {
    var g = G;
    if (g.tut === 0) { g.tutMove += Math.abs(g.px - g.tutPx); g.tutPx = g.px; if (g.tutMove > 90) { g.tut = 1; SFX.tap(); } }
    else if (g.tut === 1) { if (g.goals >= 1) { g.tut = 2; g.tilt = 0.5; g.wasY = true; } }
    else if (g.tut === 2) { if (g.resets >= 1) { g.tut = 3; } else g.tilt = Math.max(g.tilt, 0.5); }
    g.clock = 3.6; tutDraw();
  }

  /* ---------- events ---------- */
  document.addEventListener('click', function (e) {
    var el = e.target.closest ? e.target.closest('[data-act]') : null; if (!el || el.disabled) return;
    var a = el.getAttribute('data-act');
    if (hubAct(a, el)) return;
    if (a === 'lang') { S.lang = S.lang === 'en' ? 'ru' : 'en'; save(); if (view === 'play' || view === 'drill' || view === 'tres') { el.textContent = S.lang === 'en' ? 'RU' : 'EN'; } else render(); return; }
    if (a === 'sound') { S.sound = !S.sound; save(); el.setAttribute('aria-pressed', String(S.sound)); SFX.tap(); return; }
    if (a === 'play') { SFX.tap(); startMatch(); return; }
    if (a === 'go') { SFX.tap(); pick = {}; view = el.getAttribute('data-v'); render(); return; }
    if (a === 'pick') { pick[el.getAttribute('data-k')] = el.getAttribute('data-v'); SFX.tap(); var y = document.getElementById('stage').scrollTop; render(); document.getElementById('stage').scrollTop = y; return; }
    if (a === 'crafted') { S.reset = { gesture: pick.gesture, word: pick.word }; S.n = 2; save(); SFX.reset(); view = 'intro'; render(); return; }
    if (a === 'reflected') { S.upg[pick.upg] = true; S.seen = pick.when; S.n = last().n + 1; S.hub = true; save(); SFX.flow(); view = 'home'; render(); return; }
    if (a === 'next') { S.n = last().n + 1; save(); view = 'intro'; render(); return; }
    if (a === 'askwipe') { askWipe = true; render(); return; }
    if (a === 'wipe') { var l = S.lang, s = S.sound; S = blank(); S.lang = l; S.sound = s; askWipe = false; save(); view = 'intro'; render(); return; }
  });

  window.__season = { f: function () { return F ? { x: F.x, y: F.y } : null; }, g: function () { return G; }, s: function () { return S; }, dur: function (v) { DUR = v; } };
  // незаконченный шаг после перезагрузки: возвращаем на итог последнего матча
  if (S.hub) { view = 'home'; S.tut = true; }
  else if (S.hist.length && last().n === S.n && !(S.n === 1 && S.reset)) view = 'result';
  render();
})();
</script>
