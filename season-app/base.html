<title>Edge Season MVP</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/*FONTS*/
/* Layout: one-screen app. Text screens are centred cards with the main button docked at the bottom; the match fills the screen and has no buttons. */
:root {
  color-scheme: dark;
  --ink: #181425; --navy: #262b44; --slate: #3a4466; --steel: #5a6988; --mist: #c0cbdc; --white: #ffffff;
  --red: #e43b44; --red-dark: #9e2835; --gold: #feae34; --yellow: #fee761; --green: #63c74d; --cyan: #2ce8f5; --dim: #8b9bb4;
  --head: "Press Start 2P", "Courier New", monospace;
  --body: "Handjet", "Arial Narrow", "Segoe UI", sans-serif;
  --px: 4px;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--ink); color: var(--mist); font-family: var(--body); font-size: 22px; line-height: 1.15; overflow: hidden; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--cyan); outline-offset: 2px; }
canvas { image-rendering: pixelated; }
p { margin: 0; }
.app { height: 100%; max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; }
.gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.hud { display: flex; align-items: center; gap: 10px; padding-block: 6px; border-bottom: var(--px) solid var(--slate); }
.hud__ce { font-family: var(--head); font-size: 11px; background: var(--red); color: var(--ink); padding: 8px 7px; border: 3px solid var(--white); }
.hud__t { font-family: var(--head); font-size: 9px; color: var(--yellow); flex: 1 1 0; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip { font-family: var(--head); font-size: 9px; background: var(--ink); color: var(--green); border: 3px solid var(--green); padding: 7px 8px; min-height: 44px; min-width: 44px; }
.chip[aria-pressed="false"] { color: var(--steel); border-color: var(--steel); }
.stage { flex: 1 1 0; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; padding-block: 16px; }
.stage__in { margin-block: auto; display: flex; flex-direction: column; gap: 12px; }
.foot { display: flex; flex-direction: column; gap: 8px; padding-block: 10px max(12px, env(safe-area-inset-bottom, 0px)); border-top: var(--px) solid var(--slate); }
.h1 { font-family: var(--head); font-size: 15px; line-height: 1.5; color: var(--yellow); margin: 0; text-wrap: balance; }
.h2 { font-family: var(--head); font-size: 10px; line-height: 1.6; color: var(--cyan); margin: 0; }
.tag { font-family: var(--head); font-size: 9px; color: var(--ink); background: var(--yellow); padding: 5px 6px; align-self: flex-start; }
.tag--red { background: var(--red); color: var(--white); }
.tag--mute { background: var(--slate); color: var(--mist); }
.lead { color: var(--white); font-size: 24px; }
.note { font-size: 20px; color: var(--dim); }
.panel { background: var(--navy); border: var(--px) solid var(--slate); padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.panel--hot { border-color: var(--yellow); }
.btn { font-family: var(--head); font-size: 11px; line-height: 1.4; background: var(--gold); color: var(--ink); border: 0; padding: 14px 12px; min-height: 52px; width: 100%; box-shadow: inset 0 4px 0 var(--yellow), inset 0 -4px 0 #b86f50, 0 4px 0 #0e0c18; }
.btn:disabled { background: var(--slate); color: var(--steel); box-shadow: none; cursor: default; }
.btn--ghost { background: var(--ink); color: var(--white); box-shadow: inset 0 0 0 3px var(--white); }
.keys { display: grid; grid-template-columns: auto 1fr; gap: 8px 12px; align-items: baseline; }
.keys b { font-family: var(--head); font-size: 9px; font-weight: 400; color: var(--yellow); }
.cards { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.card { background: var(--ink); border: 3px solid var(--steel); color: var(--mist); padding: 12px 8px; min-height: 60px; font-size: 22px; text-align: center; }
.card[aria-pressed="true"] { background: var(--yellow); border-color: var(--yellow); color: var(--ink); }
.opt { background: var(--ink); border: 3px solid var(--steel); padding: 12px; text-align: left; display: flex; flex-direction: column; gap: 8px; color: var(--mist); width: 100%; min-height: 64px; }
.opt b { font-family: var(--head); font-size: 10px; font-weight: 400; color: var(--white); line-height: 1.6; }
.opt .dots { display: flex; gap: 14px; flex-wrap: wrap; font-size: 19px; color: var(--dim); align-items: center; }
.dot { display: inline-block; border-radius: 50%; background: var(--cyan); margin-right: 6px; vertical-align: middle; }
.dot.s { width: 8px; height: 8px; } .dot.l { width: 15px; height: 15px; }
.node { display: flex; gap: 12px; align-items: center; background: var(--navy); border: var(--px) solid var(--slate); padding: 10px 12px; width: 100%; text-align: left; color: var(--mist); min-height: 64px; }
.node b { font-family: var(--head); font-size: 9px; font-weight: 400; line-height: 1.6; color: var(--white); display: block; }
.node--open { border-color: var(--yellow); }
.node--done { border-color: var(--green); }
.node--locked { opacity: .5; }
.node .st { font-family: system-ui, sans-serif; font-size: 20px; color: var(--yellow); white-space: nowrap; }
.grow { flex: 1 1 0; min-width: 0; }
.meters { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; align-items: center; }
.meters span { font-family: var(--head); font-size: 9px; color: var(--mist); }
.pips { display: flex; gap: 4px; }
.pips i { width: 18px; height: 12px; background: #0e0c18; border: 2px solid var(--slate); display: block; }
.pips i.on { background: var(--green); border-color: var(--green); }
.final { font-family: var(--head); font-size: 24px; color: var(--white); text-align: center; letter-spacing: .08em; }
.final small { display: block; font-size: 9px; color: var(--dim); margin-top: 8px; }
.star { display: grid; grid-template-columns: 30px 1fr; gap: 10px; align-items: center; }
.star i { font-family: system-ui, sans-serif; font-style: normal; font-size: 26px; line-height: 1; color: var(--slate); text-align: center; }
.star.on i { color: var(--yellow); } .star.on span { color: var(--white); }
.stats { display: grid; grid-template-columns: 1fr auto; gap: 6px 14px; align-items: baseline; }
.stats b { font-family: var(--head); font-size: 11px; font-weight: 400; color: var(--white); }
.line { border-left: var(--px) solid var(--cyan); padding-left: 10px; color: var(--white); }
.board { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; padding-block: 6px 4px; font-family: var(--head); font-size: 9px; }
.board b { font-size: 18px; font-weight: 400; color: var(--white); margin: 0 6px; }
.board span:last-child { text-align: right; }
.board .t { color: var(--yellow); font-size: 12px; text-align: center; }
.pace { position: relative; height: 16px; background: var(--navy); border: 3px solid var(--steel); margin-bottom: 4px; }
.pace i { position: absolute; top: 0; bottom: 0; left: 0; background: var(--slate); }
.pace u { position: absolute; top: -3px; bottom: -3px; width: 4px; background: var(--red); }
.pace u.hit { background: var(--steel); }
.pacecap { font-family: var(--head); font-size: 8px; color: var(--dim); display: flex; justify-content: space-between; gap: 8px; padding-bottom: 4px; }
.rinkwrap { flex: 1 1 0; min-height: 0; display: flex; align-items: center; justify-content: center; position: relative; padding-bottom: max(8px, env(safe-area-inset-bottom, 0px)); }
#rink { display: block; border: var(--px) solid var(--slate); touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; background: #dfe9f5; }
.coach { position: absolute; left: 50%; top: 36%; transform: translateX(-50%); width: min(88%, 310px); background: rgba(24, 20, 37, .94); border: var(--px) solid var(--yellow); padding: 10px 12px; pointer-events: none; z-index: 5; }
.coach b { font-family: var(--head); font-size: 10px; font-weight: 400; line-height: 1.5; color: var(--yellow); display: block; margin-bottom: 4px; }
.coach p { color: var(--white); font-size: 21px; }
.log { background: #0e0c18; border: 3px solid var(--steel); color: var(--mist); padding: 10px; width: 100%; height: 260px; font: 13px/1.35 ui-monospace, Menlo, Consolas, monospace; resize: none; }
@media (max-width: 360px) { body { font-size: 20px; } }
</style>

<div class="app" id="app"></div>

<script>
(function () {
  'use strict';
  var OUT = '#181425';
/*SPRITES*/

  /* ---------- состояние и журнал теста (только на этом устройстве) ---------- */
  var KEY = 'ce-season-mvp-1', LOGKEY = 'ce-season-mvp-log';
  function blank() { return { sound: true, done: {}, stars: {}, role: null, num: null, values: [], core: false, trust: 0, room: 0, fix: false, reset: null, life: {}, taught: false }; }
  var S = blank(), LOG = [], T0 = Date.now();
  try { var raw = localStorage.getItem(KEY); if (raw) { var o = JSON.parse(raw); for (var k in o) S[k] = o[k]; } LOG = JSON.parse(localStorage.getItem(LOGKEY) || '[]'); } catch (e) {}
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
  function log(m, e, d) { var r = { t: Math.round((Date.now() - T0) / 100) / 10, m: m, e: e }; if (d) for (var k in d) r[k] = d[k]; LOG.push(r); if (LOG.length > 3000) LOG.shift(); try { localStorage.setItem(LOGKEY, JSON.stringify(LOG)); } catch (x) {} }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  var app = document.getElementById('app'), view = 'home';

  /* ---------- звук ---------- */
  var audio = null;
  function ac() { if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)(); if (audio.state === 'suspended') audio.resume(); return audio; }
  function beep(notes, vol) {
    if (!S.sound) return;
    try { var a = ac(), at = a.currentTime + 0.01;
      notes.forEach(function (n) { var o = a.createOscillator(), g = a.createGain(); o.type = n[2] || 'square'; o.frequency.setValueAtTime(n[0], at);
        if (n[3]) o.frequency.exponentialRampToValueAtTime(n[3], at + n[1]);
        g.gain.setValueAtTime((vol || 0.05) * 0.5, at); g.gain.exponentialRampToValueAtTime(0.0001, at + n[1]); o.connect(g); g.connect(a.destination); o.start(at); o.stop(at + n[1] + 0.02); at += n[1] * 0.85; });
    } catch (e) {}
  }
  function noise(dur, freq, vol) {
    if (!S.sound) return null;
    try { var a = ac(), n = Math.floor(a.sampleRate * dur), buf = a.createBuffer(1, n, a.sampleRate), d = buf.getChannelData(0);
      for (var i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
      var s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain(); s.buffer = buf; f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = 0.6; g.gain.value = vol; s.connect(f); f.connect(g); g.connect(a.destination); return { s: s, g: g, a: a };
    } catch (e) { return null; }
  }
  function roar(v) { var n = noise(0.9, 900, 0.09 * v); if (n) { n.g.gain.exponentialRampToValueAtTime(0.0001, n.a.currentTime + 0.9); n.s.start(); } }
  var breathNode = null;
  function breathSound(on) {
    try {
      if (on && !breathNode) { var n = noise(3, 420, 0.0001); if (!n) return; n.s.loop = true; n.g.gain.linearRampToValueAtTime(0.06, n.a.currentTime + 0.3); n.s.start(); breathNode = n; }
      else if (!on && breathNode) { var b = breathNode; breathNode = null; b.g.gain.linearRampToValueAtTime(0.0001, b.a.currentTime + 0.12); b.s.stop(b.a.currentTime + 0.15); }
    } catch (e) {}
  }
  function buzz(ms) { try { if (S.sound && navigator.vibrate) navigator.vibrate(ms); } catch (e) {} }
  var SFX = {
    tap: function () { beep([[660, 0.05]]); },
    shot: function () { beep([[900, 0.09, 'square', 180]]); },
    full: function () { beep([[1319, 0.06, 'triangle']], 0.07); },
    goal: function (k) { var m = Math.pow(1.122, Math.min(6, (k || 1) - 1)); beep([[523 * m, 0.07], [659 * m, 0.07], [784 * m, 0.07], [1047 * m, 0.24]], 0.07); roar(0.6); },
    top: function () { beep([[784, 0.06], [988, 0.06], [1175, 0.06], [1568, 0.06], [2093, 0.3]], 0.08); roar(1); },
    bad: function () { beep([[200, 0.1, 'triangle', 90]], 0.08); },
    post: function () { beep([[1568, 0.05, 'triangle'], [1319, 0.16, 'triangle']], 0.09); },
    riv: function () { beep([[140, 0.14, 'sawtooth'], [110, 0.22, 'sawtooth']], 0.06); },
    core: function () { beep([[262, 0.1, 'triangle'], [392, 0.1, 'triangle'], [523, 0.1, 'triangle'], [784, 0.3, 'triangle']], 0.1); },
    end: function () { beep([[523, 0.12], [392, 0.12], [523, 0.3]], 0.06); }
  };

  /* ---------- экраны ---------- */
  function hud(title) { return '<header class="hud gut"><span class="hud__ce">CE</span><span class="hud__t">' + title + '</span><button class="chip" data-act="sound" type="button" aria-pressed="' + !!S.sound + '">ЗВУК</button></header>'; }
  function screen(title, body, foot) { app.innerHTML = hud(title) + '<main class="stage gut" id="stage"><div class="stage__in">' + body + '</div></main>' + (foot ? '<div class="foot gut">' + foot + '</div>' : ''); }
  function pips(n) { var h = '<span class="pips">'; for (var i = 0; i < 3; i++) h += '<i' + (i < n ? ' class="on"' : '') + '></i>'; return h + '</span>'; }

  var VALUES = ['Трудолюбие', 'Честность', 'Смелость', 'Дисциплина', 'Верность команде', 'Спокойствие', 'Любопытство', 'Упорство', 'Ответственность', 'Уважение', 'Радость игры', 'Смирение'];
  var NUMS = ['9', '17', '19', '27', '71', '88'];
  var MATCHES = [
    { id: 1, name: 'ПЕРВЫЙ ВЫХОД', rival: 'Новичок', about: 'Юниорская лига. Тренер выпускает тебя в первой смене.', g: { gain: 0.34, shotGain: 0.14, cool: 0.07, speed: 0.6 }, riv: [[], [18], [12, 28]], defs: [0, 1, 2],
      star3: 'Одна «девятка» за матч', s3: function (r) { return r.tops >= 1; } },
    { id: 2, name: 'ЗА ЧТО ТЕБЯ ЦЕНИТЬ', rival: 'Горячий', about: 'Вратарь соперника закипает после пропущенной и начинает ошибаться.', g: { gain: 0.6, shotGain: 0, cool: 0.035, speed: 1 }, riv: [[24], [14, 30], [10, 26]], defs: [1, 1, 2],
      star3: 'Стержень использован с горячей головой', s3: function (r) { return r.coreHot; } },
    { id: 3, name: 'ПЕРВАЯ ОШИБКА', rival: 'Горячий', about: 'В первом отрезке ты пропустишь. Это не твоя ошибка. Смотри, что будет дальше.', g: { gain: 0.6, shotGain: 0, cool: 0.035, speed: 1 }, riv: [[6], [16], [10, 26]], defs: [1, 1, 2],
      star3: 'Первый бросок после пропущенной был с выдохом', s3: function (r) { return r.firstAfterBreath; } },
    { id: 4, name: 'СКАМЕЙКА', rival: 'Стена', about: 'Вратарь соперника почти не греется. Его берут терпением. Первый отрезок ты сидишь на скамейке.', g: { gain: 0.1, shotGain: 0, cool: 0.16, speed: 1.05 }, riv: [[8], [18], [12, 27]], defs: [1, 2, 2], bench1: true,
      star3: 'Два гола с выдоха', s3: function (r) { return r.breathGoals >= 2; } }
  ];
  function next() { for (var i = 0; i < MATCHES.length; i++) if (!S.done[MATCHES[i].id]) return MATCHES[i].id; return 0; }

  function home() {
    view = 'home'; var nx = next(), h = '<span class="tag">АКТ 1 · ТАЛАНТ</span><h1 class="h1">СЕЗОН</h1>';
    if (S.role) h += '<section class="panel"><div class="meters"><span>ИГРОК</span><span style="color:#fff">№' + esc(S.num) + ' · ' + (S.role === 'D' ? 'ЗАЩИТНИК' : 'НАПАДАЮЩИЙ') + '</span>' +
      '<span>ДОВЕРИЕ</span>' + pips(S.trust) + '<span>РАЗДЕВАЛКА</span>' + pips(S.room) +
      (S.values.length ? '<span>СТЕРЖЕНЬ</span><span style="color:' + (S.core ? '#2ce8f5' : '#8b9bb4') + '">' + (S.core ? 'ЗАРЯЖЕН' : 'ПУСТ') + '</span>' : '') + '</div></section>';
    MATCHES.forEach(function (m) {
      var done = S.done[m.id], open = m.id === nx, st = S.stars[m.id] || 0;
      h += '<button class="node ' + (done ? 'node--done' : open ? 'node--open' : 'node--locked') + '" type="button" data-act="match" data-m="' + m.id + '"' + (done || open ? '' : ' disabled') + '><span class="grow"><b>' + m.id + ' · ' + m.name + '</b>Соперник: ' + m.rival + '</span><span class="st">' + (done ? '★'.repeat(st) + '☆'.repeat(3 - st) : open ? '▶' : '') + '</span></button>';
    });
    if (!nx) h += '<section class="panel panel--hot"><p class="lead">Четыре матча пройдены. Дальше в полной версии: дерби и первый месяц до конца.</p></section>';
    screen('СЕЗОН', h, '<button class="btn btn--ghost" type="button" data-act="logs">ЖУРНАЛ ТЕСТА</button>');
  }
  function logs() {
    view = 'logs';
    screen('ЖУРНАЛ ТЕСТА', '<p class="note">События этой игры. Хранятся только на этом телефоне и никуда не отправляются. Наблюдатель может скопировать их и переслать.</p>' +
      '<textarea class="log" id="logbox" readonly>' + esc(LOG.map(function (r) { return JSON.stringify(r); }).join('\n')) + '</textarea><p class="note" id="logmsg">Записей: ' + LOG.length + '</p>',
      '<button class="btn" type="button" data-act="copylog">СКОПИРОВАТЬ</button><button class="btn btn--ghost" type="button" data-act="home">НАЗАД</button><button class="btn btn--ghost" type="button" data-act="wipe">СТЕРЕТЬ ВСЁ И НАЧАТЬ ЗАНОВО</button>');
  }

  /* ---------- решения: вопрос, два варианта, точки над показателями ---------- */
  var D = null;
  function decide(mid, key, q, opts, cb, tag) {
    D = { mid: mid, key: key, opts: opts, cb: cb, at: Date.now(), chosen: null };
    view = 'decide';
    screen('РЕШЕНИЕ', '<span class="tag tag--red">' + (tag || 'СКАМЕЙКА') + '</span><p class="lead">' + q + '</p>' +
      opts.map(function (o, i) { return '<button class="opt" type="button" data-act="choose" data-i="' + i + '"><b>' + o.label + '</b>' +
        (o.dots ? '<span class="dots">' + o.dots.map(function (d) { return '<span><i class="dot ' + (d[1] > 1 ? 'l' : 's') + '"></i>' + d[0] + '</span>'; }).join('') + '</span>' : '') + '</button>'; }).join('') +
      '<p class="note">Точки показывают, что изменится. Больше точка: сильнее.</p>');
  }
  function chose(i) {
    var d = D, o = d.opts[i], ms = Date.now() - d.at, lines = o.apply() || [], spirit = (o.vals || []).filter(function (v) { return S.values.indexOf(v) >= 0; })[0];
    if (spirit && S.values.length) { S.core = true; lines.push('Стержень заряжен: это было в духе твоей ценности «' + spirit + '»'); }
    save(); log(d.mid, 'decision', { key: d.key, choice: i, ms: ms, spirit: spirit || null });
    view = 'decided';
    screen('РЕШЕНИЕ', '<span class="tag">ТЫ ВЫБРАЛ</span><h1 class="h1">' + o.label + '</h1>' + lines.map(function (l) { return '<p class="line">' + l + '</p>'; }).join(''),
      '<button class="btn" type="button" data-act="decided">ДАЛЬШЕ ▶</button>');
    D.after = function () { d.cb(i, !!spirit); };
  }

  /* ---------- до и после матчей ---------- */
  var pick = {}, FLOW = null;
  function runMatch(id) {
    var m = MATCHES[id - 1]; pick = {}; log(id, 'open');
    if (id === 1 && !S.role) return pre1a();
    if (id === 2 && S.values.length < 3) return values(0);
    brief(m);
  }
  function brief(m) {
    view = 'brief';
    var keys = m.id === 1 ? '<section class="panel"><div class="keys"><b>ВЕДИ</b><span>Палец по льду: игрок едет за ним.</span><b>ЗАМРИ</b><span>Останови палец и держи. Игрок выдыхает, линия сужается, голова остывает.</span><b>ОТПУСТИ</b><span>Бросок.</span></div></section>' : '';
    var extra = m.id === 2 ? '<section class="panel panel--hot"><h2 class="h2">НОВОЕ: СТЕРЖЕНЬ</h2><p>Значок слева внизу на льду. Один тап за матч сразу остужает голову. Заряжается, когда ты решаешь в духе своих ценностей.</p></section>'
